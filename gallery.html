<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gallery — Le Petit Sac</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="translations.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-row">
        <a class="logo" href="index.html">Le Petit Sac</a>
        <button id="navToggle" class="nav-toggle" aria-label="Toggle navigation">☰</button>
        <nav id="mainNav" class="nav" aria-label="Primary navigation">
          <a class="nav-link" href="index.html" data-i18n="home">Home</a>
          <a class="nav-link" href="about.html" data-i18n="about">About</a>
          <a class="nav-link" href="gallery.html" data-i18n="gallery">Gallery</a>
          <a class="nav-link" href="contact.html" data-i18n="contact">Contact</a>
        </nav>
        <div class="lang-switcher">
          <button class="lang-btn" data-lang="vi">VI</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
    </header>

    <main>
      <section class="hero hero-gallery">
        <div class="container hero-inner">
          <p class="eyebrow" data-i18n="gallery_tagline">Visual Gallery</p>
          <h1 data-i18n="gallery_title">Handmade bags and hats in action.</h1>
          <p class="hero-copy" data-i18n="gallery_copy">Explore our collections of beautifully crafted handbags and hats. Click any image to view full details.</p>
        </div>
      </section>

      <section class="container gallery-section">
        <div class="product-tabs-nav">
          <a href="#handbags" class="product-tab active" data-category="handbags" data-i18n="handbags">Handbags</a>
          <a href="#hats" class="product-tab" data-category="hats" data-i18n="hats">Hats</a>
        </div>
        <div class="gallery-grid" id="galleryGrid">
          <!-- Gallery items will be populated here -->
        </div>
      </section>
    </main>

    <!-- Lightbox modal -->
    <div class="lightbox" id="lightbox">
      <div class="lightbox-content">
        <button class="lightbox-close" id="lightboxClose">&times;</button>
        <div class="lightbox-image-container">
          <button class="lightbox-nav lightbox-prev" id="lightboxPrev">‹</button>
          <img id="lightboxImage" src="" alt="">
          <button class="lightbox-nav lightbox-next" id="lightboxNext">›</button>
          <span class="image-counter" id="imageCounter"></span>
        </div>
        <div class="lightbox-caption">
          <h2 id="lightboxTitle"></h2>
          <p id="lightboxDesc"></p>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <div class="container footer-grid">
        <div>
          <p class="footer-logo">Le Petit Sac</p>
          <p data-i18n="footer_description">Beautiful handmade bags for your everyday story.</p>
        </div>
      </div>
    </footer>

    <script src="gallery-data.js"></script>
    <script src="script.js" defer></script>
  </body>
</html>
