<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Static Site</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1 class="logo">MySite</h1>
        <button id="navToggle" class="nav-toggle" aria-label="Toggle navigation">☰</button>
        <nav id="mainNav" class="nav">
          <a href="#home">Home</a>
          <a href="#about">About</a>
          <a href="#contact">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section id="home" class="hero container">
        <h2>Welcome</h2>
        <p>This is a minimal static HTML site scaffolded for you.</p>
      </section>

      <section id="about" class="container">
        <h2>About</h2>
        <p>Build pages by editing <code>index.html</code>, style with <code>styles.css</code>, and add interactivity in <code>script.js</code>.</p>
      </section>

      <section id="contact" class="container">
        <h2>Contact</h2>
        <form id="contactForm">
          <label for="name">Name</label>
          <input id="name" name="name" required>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4"></textarea>
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">© <span id="year"></span> MySite</div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
