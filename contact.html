<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — My Static Site</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-row">
        <a class="logo" href="index.html">MySite</a>
        <button id="navToggle" class="nav-toggle" aria-label="Toggle navigation">☰</button>
        <nav id="mainNav" class="nav" aria-label="Primary navigation">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="about.html">About</a>
          <a class="nav-link" href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <h2>Contact</h2>
        <p>Use this page to collect messages or show your contact details.</p>
      </section>

      <section class="page-card">
        <h2>Send a message</h2>
        <form id="contactForm">
          <label for="name">Name</label>
          <input id="name" name="name" required>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4"></textarea>
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">© <span id="year"></span> MySite</div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
